# GatekeeperVPN Client Configuration

# Server address
server = "127.0.0.1:8443"

# Client's private key (base64 encoded)
# Generate with: cargo run --bin gatekeeper-client (will print a new keypair)
private_key = ""

# Server's public key (base64 encoded)
# Get this from the server output when it starts
server_public_key = ""

# DNS servers to use when VPN is connected (empty = don't change DNS)
# dns_servers = ["1.1.1.1", "8.8.8.8"]

# Obfuscation (anti-DPI). Enabled by default.
# PSK auto-generated if not set, but must match on server and client.
# Generate PSK: gkvpn generate-psk
# [obfuscation]
# enabled = true           # default: true
# psk = "base64-encoded-32-byte-key"  # auto-generated if empty
# header_size = 4          # default: 4
# min_padding = 16         # default: 16
# max_padding = 64         # default: 32
# junk_min = 1             # default: 1
# junk_max = 3             # default: 3
